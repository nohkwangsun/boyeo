<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>마크다운 뷰어</title>
  <meta name="description" content="모바일에서 마크다운 파일을 편하게 읽는 뷰어" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MD 뷰어" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 아이콘 스프라이트: 단색 라인 아이콘, 본문 색상을 그대로 상속한다 -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-list" viewBox="0 0 24 24">
      <line x1="9" y1="6" x2="20" y2="6" /><line x1="9" y1="12" x2="20" y2="12" /><line x1="9" y1="18" x2="20" y2="18" />
      <circle cx="4.5" cy="6" r="1.1" /><circle cx="4.5" cy="12" r="1.1" /><circle cx="4.5" cy="18" r="1.1" />
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" />
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M21 19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2z" />
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" />
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" />
    </symbol>
    <symbol id="i-doc" viewBox="0 0 24 24">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><polyline points="14 3 14 8 19 8" />
      <line x1="15" y1="13" x2="9" y2="13" /><line x1="15" y1="17" x2="9" y2="17" />
    </symbol>
  </svg>

  <header class="topbar" id="topbar">
    <h1 class="topbar-title" id="doc-title">마크다운 뷰어</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-toc" type="button" aria-label="목차">
        <svg class="icon"><use href="#i-list" /></svg>
      </button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="메뉴">
        <svg class="icon"><use href="#i-more" /></svg>
      </button>
    </div>
  </header>

  <main class="viewer" id="viewer">
    <article class="doc" id="preview"></article>

    <section class="empty" id="empty">
      <svg class="empty-icon"><use href="#i-doc" /></svg>
      <h2>읽을 문서를 열어주세요</h2>
      <p>기기에 저장된 <code>.md</code> 파일을 그대로 열어볼 수 있습니다.</p>
      <button class="btn-primary" id="btn-open-primary" type="button">파일 열기</button>
      <button class="btn-quiet" id="btn-write" type="button">직접 작성하기</button>
    </section>
  </main>

  <input
    type="file"
    id="file-input"
    accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain"
    hidden
  />

  <!-- 편집: 뷰어와 분리된 별도 모드 -->
  <div class="edit-mode" id="edit-mode" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-edit-back" type="button" aria-label="뷰어로 돌아가기">
        <svg class="icon"><use href="#i-back" /></svg>
      </button>
      <h2 class="topbar-title">편집</h2>
      <div class="topbar-actions">
        <button class="btn-done" id="btn-edit-done" type="button">완료</button>
      </div>
    </header>
    <textarea
      id="editor"
      placeholder="마크다운을 입력하세요..."
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
    ></textarea>
  </div>

  <!-- 목차 -->
  <aside class="drawer" id="toc-drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>목차</h2>
      <button class="icon-btn" id="btn-toc-close" type="button" aria-label="닫기">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
    </div>
    <nav class="drawer-body" id="toc-list"></nav>
  </aside>

  <!-- 메뉴 -->
  <div class="sheet" id="menu-sheet" aria-hidden="true">
    <div class="sheet-grip"></div>

    <button class="sheet-row" id="btn-open" type="button">
      <svg class="icon"><use href="#i-folder" /></svg><span>파일 열기</span>
    </button>
    <button class="sheet-row" id="btn-edit" type="button">
      <svg class="icon"><use href="#i-edit" /></svg><span>편집</span>
    </button>
    <button class="sheet-row" id="btn-save" type="button">
      <svg class="icon"><use href="#i-download" /></svg><span>파일로 저장</span>
    </button>

    <div class="sheet-sep"></div>

    <div class="sheet-field">
      <span class="sheet-label">글자 크기</span>
      <div class="stepper">
        <button id="btn-font-minus" type="button" aria-label="글자 작게">−</button>
        <span id="font-value">17</span>
        <button id="btn-font-plus" type="button" aria-label="글자 크게">+</button>
      </div>
    </div>

    <div class="sheet-field">
      <span class="sheet-label">테마</span>
      <div class="segmented" id="theme-seg">
        <button data-theme="auto" type="button">자동</button>
        <button data-theme="light" type="button">밝게</button>
        <button data-theme="dark" type="button">어둡게</button>
      </div>
    </div>

    <div class="sheet-sep"></div>

    <button class="sheet-row danger" id="btn-clear" type="button">
      <svg class="icon"><use href="#i-trash" /></svg><span>내용 비우기</span>
    </button>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="dropzone" id="dropzone"><p>마크다운 파일을 놓으세요</p></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
