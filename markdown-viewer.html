  <style>
:root {
  --bg: #f8fafc;
  --bg-elevated: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-contrast: #ffffff;
  --code-bg: #f1f5f9;
  --code-text: #334155;
  --scrim: rgba(15, 23, 42, 0.45);
  --content-font-size: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

html[data-theme='dark'] {
  --bg: #0f172a;
  --bg-elevated: #1e293b;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --border: #334155;
  --accent: #60a5fa;
  --accent-contrast: #0f172a;
  --code-bg: #0b1220;
  --code-text: #cbd5e1;
  --scrim: rgba(0, 0, 0, 0.6);
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme='light']):not([data-theme='dark']) {
    --bg: #0f172a;
    --bg-elevated: #1e293b;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent: #60a5fa;
    --accent-contrast: #0f172a;
    --code-bg: #0b1220;
    --code-text: #cbd5e1;
    --scrim: rgba(0, 0, 0, 0.6);
  }
}

* {
  box-sizing: border-box;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR',
    'Apple SD Gothic Neo', sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button {
  font-family: inherit;
}

/* ---------- Header ---------- */
.app-header {
  flex: 0 0 auto;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + var(--safe-top)) calc(10px + var(--safe-right)) 0 calc(10px + var(--safe-left));
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header h1 {
  font-size: 16px;
  margin: 0 0 8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 8px;
}

.toolbar button {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  min-height: 36px;
  cursor: pointer;
  white-space: nowrap;
}

.toolbar button:active {
  transform: scale(0.97);
}

.toolbar button.primary {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.filename-badge {
  font-size: 12px;
  color: var(--text-muted);
  align-self: center;
  padding: 0 4px;
  max-width: 40vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Tabs (mobile view switcher) ---------- */
.tabs {
  display: flex;
  gap: 4px;
}

.tab {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-muted);
  padding: 10px 0;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}

.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ---------- Workspace / panes ---------- */
.workspace {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

.pane {
  flex: 1 1 100%;
  min-width: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* mobile: only show the active pane */
.workspace.view-edit .preview-pane {
  display: none;
}

.workspace.view-preview .edit-pane {
  display: none;
}

#editor {
  width: 100%;
  height: 100%;
  border: none;
  resize: none;
  outline: none;
  background: var(--bg);
  color: var(--text);
  padding: 16px calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) 16px;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: var(--content-font-size);
  line-height: 1.6;
}

.preview-pane {
  background: var(--bg-elevated);
}

#preview {
  padding: 16px calc(16px + var(--safe-right)) calc(32px + var(--safe-bottom)) 16px;
  max-width: 780px;
  margin: 0 auto;
  font-size: var(--content-font-size);
}

#preview.empty::before {
  content: '미리보기가 여기에 표시됩니다.';
  color: var(--text-muted);
}

/* ---------- Wide screens: split view ---------- */
@media (min-width: 860px) {
  .tabs {
    display: none;
  }

  .workspace.view-edit .preview-pane,
  .workspace.view-preview .edit-pane {
    display: block;
  }

  .edit-pane {
    border-right: 1px solid var(--border);
  }
}

/* ---------- Markdown content styling ---------- */
.markdown-body {
  line-height: 1.7;
  word-wrap: break-word;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  font-weight: 700;
  line-height: 1.35;
  margin: 1.4em 0 0.6em;
  scroll-margin-top: calc(90px + var(--safe-top));
}

.markdown-body h1 {
  font-size: 1.7em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}

.markdown-body h2 {
  font-size: 1.4em;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.25em;
}

.markdown-body h3 {
  font-size: 1.2em;
}

.markdown-body p,
.markdown-body ul,
.markdown-body ol,
.markdown-body blockquote,
.markdown-body table,
.markdown-body pre {
  margin: 0.8em 0;
}

.markdown-body a {
  color: var(--accent);
}

.markdown-body img {
  max-width: 100%;
  border-radius: 8px;
}

.markdown-body blockquote {
  margin-left: 0;
  padding: 0.2em 1em;
  border-left: 4px solid var(--accent);
  color: var(--text-muted);
  background: var(--code-bg);
  border-radius: 0 8px 8px 0;
}

.markdown-body code {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 0.15em 0.4em;
  border-radius: 4px;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 0.9em;
}

.markdown-body pre {
  background: var(--code-bg);
  padding: 12px 14px;
  border-radius: 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.markdown-body pre code {
  background: none;
  padding: 0;
  font-size: 0.85em;
}

.markdown-body table {
  border-collapse: collapse;
  width: 100%;
  display: block;
  overflow-x: auto;
}

.markdown-body th,
.markdown-body td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
}

.markdown-body th {
  background: var(--code-bg);
}

.markdown-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2em 0;
}

.markdown-body li {
  margin: 0.25em 0;
}

.markdown-body input[type='checkbox'] {
  margin-right: 0.4em;
  transform: translateY(1px);
}

/* ---------- TOC drawer ---------- */
.toc-drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  right: 0;
  width: min(320px, 85vw);
  background: var(--bg-elevated);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.22s ease;
  z-index: 40;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

.toc-drawer.open {
  transform: translateX(0);
}

.toc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.toc-header h2 {
  font-size: 15px;
  margin: 0;
}

.toc-header button {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  padding: 4px 8px;
}

#toc-list {
  overflow-y: auto;
  padding: 8px 0;
}

#toc-list p.toc-empty {
  color: var(--text-muted);
  font-size: 13px;
  padding: 0 16px;
}

.toc-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  color: var(--text);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
}

.toc-item:active {
  background: var(--code-bg);
}

.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
  z-index: 30;
}

.scrim.open {
  opacity: 1;
  pointer-events: auto;
}

/* ---------- Drag & drop overlay ---------- */
.dropzone-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--scrim);
  color: #fff;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  padding: 24px;
  pointer-events: none;
}

.dropzone-overlay.active {
  display: flex;
}

.dropzone-overlay p {
  border: 2px dashed #fff;
  border-radius: 16px;
  padding: 32px 24px;
  margin: 0;
}

@media (max-width: 480px) {
  .app-header h1 {
    font-size: 15px;
  }

  .toolbar button {
    padding: 8px;
    font-size: 12px;
  }
}

  </style>
</head>
<body>
  <header class="app-header">
    <h1>📄 마크다운 뷰어</h1>
    <div class="toolbar">
      <button id="btn-open" type="button">📂 열기</button>
      <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
      <button id="btn-save" type="button">💾 저장</button>
      <button id="btn-toc" type="button">📑 목차</button>
      <button id="btn-font-minus" type="button" aria-label="글자 작게">A-</button>
      <button id="btn-font-plus" type="button" aria-label="글자 크게">A+</button>
      <button id="btn-theme" type="button" aria-label="테마 전환">🌓</button>
      <button id="btn-clear" type="button">🗑️ 지우기</button>
      <span id="filename-badge" class="filename-badge"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="edit" role="tab" aria-selected="true">편집</button>
      <button class="tab" data-view="preview" role="tab" aria-selected="false">미리보기</button>
    </div>
  </header>

  <main class="workspace view-edit" id="workspace">
    <section class="pane edit-pane" id="edit-pane">
      <label for="editor" class="sr-only">마크다운 편집기</label>
      <textarea
        id="editor"
        placeholder="여기에 마크다운을 입력하거나 붙여넣으세요...&#10;&#10;파일 열기 버튼을 누르거나, 파일을 화면에 끌어다 놓거나,&#10;다른 앱에서 '공유'로 이 뷰어를 선택할 수도 있습니다."
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
      ></textarea>
    </section>
    <section class="pane preview-pane" id="preview-pane">
      <article id="preview" class="markdown-body empty"></article>
    </section>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="toc-drawer" id="toc-drawer" aria-hidden="true">
    <div class="toc-header">
      <h2>목차</h2>
      <button id="btn-toc-close" type="button" aria-label="목차 닫기">✕</button>
    </div>
    <nav id="toc-list"></nav>
  </aside>

  <div class="dropzone-overlay" id="dropzone-overlay">
    <p>여기에 마크다운 파일을 놓으세요</p>
  </div>

  <script>

  </script>
  <script>
(() => {
  'use strict';

  // ---------- Elements ----------
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const workspace = document.getElementById('workspace');
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const fileInput = document.getElementById('file-input');
  const filenameBadge = document.getElementById('filename-badge');

  const btnOpen = document.getElementById('btn-open');
  const btnSave = document.getElementById('btn-save');
  const btnToc = document.getElementById('btn-toc');
  const btnTocClose = document.getElementById('btn-toc-close');
  const btnFontMinus = document.getElementById('btn-font-minus');
  const btnFontPlus = document.getElementById('btn-font-plus');
  const btnTheme = document.getElementById('btn-theme');
  const btnClear = document.getElementById('btn-clear');

  const tocDrawer = document.getElementById('toc-drawer');
  const tocList = document.getElementById('toc-list');
  const scrim = document.getElementById('scrim');
  const dropzoneOverlay = document.getElementById('dropzone-overlay');

  // ---------- Storage keys ----------
  const LS_DRAFT = 'md-viewer-draft';
  const LS_FILENAME = 'md-viewer-filename';
  const LS_THEME = 'md-viewer-theme';
  const LS_FONT_SIZE = 'md-viewer-font-size';
  const LS_VIEW = 'md-viewer-view';

  const MIN_FONT = 13;
  const MAX_FONT = 26;
  const DEFAULT_FONT = 16;

  let currentFilename = '';

  // ---------- Markdown rendering ----------
  if (window.marked) {
    marked.setOptions({
      gfm: true,
      breaks: true,
    });
  }

  function renderMarkdown(source) {
    if (!source || !source.trim()) {
      preview.innerHTML = '';
      preview.classList.add('empty');
      tocList.innerHTML = '';
      renderTocEmptyState();
      return;
    }
    preview.classList.remove('empty');

    let html = '';
    try {
      html = window.marked ? window.marked.parse(source) : escapeHtml(source);
    } catch (err) {
      html = `<p>마크다운을 렌더링하는 중 오류가 발생했습니다: ${escapeHtml(String(err))}</p>`;
    }

    const clean = window.DOMPurify
      ? window.DOMPurify.sanitize(html, { ADD_ATTR: ['target'] })
      : html;

    preview.innerHTML = clean;
    postProcessPreview();
    buildToc();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function postProcessPreview() {
    // 외부 링크는 새 탭으로, 이미지는 지연 로딩
    preview.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href') || '';
      if (/^https?:\/\//i.test(href)) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
    preview.querySelectorAll('img').forEach((img) => {
      img.setAttribute('loading', 'lazy');
    });
  }

  // ---------- Table of contents ----------
  const usedSlugs = new Map();

  function slugify(text) {
    const base = text
      .trim()
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s-]/gu, '')
      .replace(/\s+/g, '-');
    const clean = base || 'section';
    const count = usedSlugs.get(clean) || 0;
    usedSlugs.set(clean, count + 1);
    return count === 0 ? clean : `${clean}-${count}`;
  }

  function buildToc() {
    usedSlugs.clear();
    const headings = Array.from(preview.querySelectorAll('h1, h2, h3, h4, h5, h6'));
    tocList.innerHTML = '';

    if (!headings.length) {
      renderTocEmptyState();
      return;
    }

    const frag = document.createDocumentFragment();
    headings.forEach((heading) => {
      const id = slugify(heading.textContent || '');
      heading.id = id;
      const level = Number(heading.tagName.substring(1));
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'toc-item';
      item.style.paddingLeft = `${16 + (level - 1) * 12}px`;
      item.textContent = heading.textContent;
      item.addEventListener('click', () => {
        setView('preview');
        closeToc();
        requestAnimationFrame(() => {
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      frag.appendChild(item);
    });
    tocList.appendChild(frag);
  }

  function renderTocEmptyState() {
    tocList.innerHTML = '<p class="toc-empty">표시할 목차가 없습니다.</p>';
  }

  function openToc() {
    tocDrawer.classList.add('open');
    tocDrawer.setAttribute('aria-hidden', 'false');
    scrim.classList.add('open');
  }

  function closeToc() {
    tocDrawer.classList.remove('open');
    tocDrawer.setAttribute('aria-hidden', 'true');
    scrim.classList.remove('open');
  }

  btnToc.addEventListener('click', () => {
    tocDrawer.classList.contains('open') ? closeToc() : openToc();
  });
  btnTocClose.addEventListener('click', closeToc);
  scrim.addEventListener('click', closeToc);

  // ---------- View switching (edit / preview tabs, mobile) ----------
  function setView(view) {
    workspace.classList.remove('view-edit', 'view-preview');
    workspace.classList.add(`view-${view}`);
    tabs.forEach((tab) => {
      const active = tab.dataset.view === view;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', String(active));
    });
    try {
      localStorage.setItem(LS_VIEW, view);
    } catch (_) {}
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => setView(tab.dataset.view));
  });

  // ---------- Editor input / autosave ----------
  let saveTimer = null;
  editor.addEventListener('input', () => {
    renderMarkdown(editor.value);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(LS_DRAFT, editor.value);
      } catch (_) {}
    }, 300);
  });

  function setEditorContent(text, filename) {
    editor.value = text;
    renderMarkdown(text);
    try {
      localStorage.setItem(LS_DRAFT, text);
    } catch (_) {}
    if (filename !== undefined) {
      currentFilename = filename;
      filenameBadge.textContent = filename;
      try {
        localStorage.setItem(LS_FILENAME, filename);
      } catch (_) {}
    }
  }

  // ---------- Open file ----------
  btnOpen.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    readFile(file);
    fileInput.value = '';
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      setEditorContent(String(reader.result || ''), file.name);
      setView('preview');
    };
    reader.onerror = () => {
      alert('파일을 읽는 중 오류가 발생했습니다.');
    };
    reader.readAsText(file);
  }

  // ---------- Drag & drop ----------
  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    dragCounter++;
    dropzoneOverlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
  });
  window.addEventListener('dragleave', () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) dropzoneOverlay.classList.remove('active');
  });
  window.addEventListener('drop', (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    dragCounter = 0;
    dropzoneOverlay.classList.remove('active');
    readFile(e.dataTransfer.files[0]);
  });

  // ---------- Save (download) ----------
  btnSave.addEventListener('click', () => {
    const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFilename && /\.\w+$/.test(currentFilename) ? currentFilename : 'document.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // ---------- Clear ----------
  btnClear.addEventListener('click', () => {
    if (editor.value.trim() && !confirm('편집 중인 내용을 모두 지울까요?')) return;
    setEditorContent('', '');
  });

  // ---------- Font size ----------
  function applyFontSize(size) {
    const clamped = Math.min(MAX_FONT, Math.max(MIN_FONT, size));
    document.documentElement.style.setProperty('--content-font-size', `${clamped}px`);
    try {
      localStorage.setItem(LS_FONT_SIZE, String(clamped));
    } catch (_) {}
    return clamped;
  }

  let fontSize = DEFAULT_FONT;
  btnFontMinus.addEventListener('click', () => {
    fontSize = applyFontSize(fontSize - 1);
  });
  btnFontPlus.addEventListener('click', () => {
    fontSize = applyFontSize(fontSize + 1);
  });

  // ---------- Theme ----------
  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      const isDark =
        theme === 'dark' ||
        (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      metaTheme.setAttribute('content', isDark ? '#0f172a' : '#f8fafc');
    }
  }

  btnTheme.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const effectiveDark = current === 'dark' || (!current && systemDark);
    const next = effectiveDark ? 'light' : 'dark';
    applyTheme(next);
    try {
      localStorage.setItem(LS_THEME, next);
    } catch (_) {}
  });

  // ---------- Share target payload pickup ----------
  async function checkSharedContent() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('shared') !== '1') return;

    // URL을 정리해 새로고침 시 중복 처리되지 않도록 함
    const cleanUrl = window.location.pathname;
    window.history.replaceState({}, '', cleanUrl);

    if (!('caches' in window)) return;
    try {
      const cache = await caches.open('md-viewer-share-v1');
      const response = await cache.match('shared-payload');
      if (!response) return;
      const data = await response.json();
      if (data && data.content) {
        setEditorContent(data.content, data.filename || '공유된 내용');
        setView('preview');
      }
      await cache.delete('shared-payload');
    } catch (err) {
      console.warn('공유된 콘텐츠를 불러오지 못했습니다.', err);
    }
  }

  // ---------- Init ----------
  function init() {
    let theme = null;
    let savedFont = null;
    let savedView = null;
    let draft = '';
    let savedFilename = '';

    try {
      theme = localStorage.getItem(LS_THEME);
      savedFont = Number(localStorage.getItem(LS_FONT_SIZE));
      savedView = localStorage.getItem(LS_VIEW);
      draft = localStorage.getItem(LS_DRAFT) || '';
      savedFilename = localStorage.getItem(LS_FILENAME) || '';
    } catch (_) {}

    applyTheme(theme);
    fontSize = applyFontSize(Number.isFinite(savedFont) && savedFont ? savedFont : DEFAULT_FONT);
    setView(savedView === 'preview' ? 'preview' : 'edit');

    if (draft) {
      currentFilename = savedFilename;
      filenameBadge.textContent = savedFilename;
      editor.value = draft;
      renderMarkdown(draft);
    } else {
      renderMarkdown('');
    }

    checkSharedContent();

    // 서비스 워커는 http(s)에서만 동작한다.
    // 단일 HTML 파일을 file://로 직접 열었을 때는 등록을 시도하지 않는다.
    const isHttp = /^https?:$/.test(window.location.protocol);
    if (isHttp && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('서비스 워커 등록 실패:', err);
        });
      });
    }
  }

  init();
})();

  </script>
</body>
</html>
