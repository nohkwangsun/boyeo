  <style>
/* ---------------------------------------------------------------
   마크다운 뷰어 — 읽기 우선 스타일
   화면의 주인공은 본문이다. 크롬(상단바/버튼)은 최대한 물러나 있는다.
   아이콘은 전부 단색 라인 아이콘이며 본문 색상 계열을 상속한다.
   --------------------------------------------------------------- */

:root {
  /* 종이에 가까운 밝은 테마 */
  --bg: #ffffff;
  --bg-soft: #f6f7f8;
  --bg-raised: #ffffff;
  --text: #1f2328;
  --text-dim: #656d76;
  --border: #e6e8eb;
  --icon: #656d76;
  --link: #2f6feb;
  --danger: #b4404a;
  --scrim: rgba(20, 22, 26, 0.32);
  --shadow: 0 8px 32px rgba(20, 22, 26, 0.14);

  --content-font-size: 17px;
  --topbar-h: 48px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', Pretendard,
    'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas,
    'Liberation Mono', monospace;
}

html[data-theme='dark'] {
  /* 순검정 대신 눈이 편한 딥 그레이 */
  --bg: #16181d;
  --bg-soft: #1d2026;
  --bg-raised: #21252c;
  --text: #d6d9df;
  --text-dim: #8b929e;
  --border: #2a2e37;
  --icon: #9aa1ac;
  --link: #6ea8fe;
  --danger: #e5707b;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme='light']):not([data-theme='dark']) {
    --bg: #16181d;
    --bg-soft: #1d2026;
    --bg-raised: #21252c;
    --text: #d6d9df;
    --text-dim: #8b929e;
    --border: #2a2e37;
    --icon: #9aa1ac;
    --link: #6ea8fe;
    --danger: #e5707b;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

.sprite {
  display: none;
}

/* 라인 아이콘 공통: 채우기 없음, 얇은 선, 색상 상속 */
.icon {
  width: 21px;
  height: 21px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 점 아이콘(목차 불릿, 더보기)은 면으로 그린다 */
#i-more circle,
#i-list circle {
  fill: currentColor;
  stroke: none;
}

/* ---------------- 상단바 ---------------- */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  height: calc(var(--topbar-h) + var(--safe-top));
  padding: var(--safe-top) calc(6px + var(--safe-right)) 0 calc(6px + var(--safe-left));
  display: flex;
  align-items: center;
  gap: 4px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid transparent;
  transition: transform 0.25s ease, border-color 0.2s ease;
}

/* 스크롤을 시작하면 그제서야 경계선을 보여준다 */
.topbar.scrolled {
  border-bottom-color: var(--border);
}

/* 아래로 읽어 내려갈 때는 상단바를 치워 본문에 집중시킨다 */
.topbar.hidden {
  transform: translateY(-100%);
}

.topbar-title {
  flex: 1;
  min-width: 0;
  margin: 0 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: none;
  background: none;
  color: var(--icon);
  border-radius: 10px;
  cursor: pointer;
  padding: 0;
}

.icon-btn:active {
  background: var(--bg-soft);
}

.btn-done {
  border: none;
  background: none;
  color: var(--link);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 10px 12px;
  cursor: pointer;
  border-radius: 10px;
}

.btn-done:active {
  background: var(--bg-soft);
}

/* ---------------- 뷰어 ---------------- */
.viewer {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-top: calc(var(--topbar-h) + var(--safe-top));
}

.doc {
  max-width: 42rem;
  margin: 0 auto;
  padding: 8px calc(20px + var(--safe-right)) calc(96px + var(--safe-bottom))
    calc(20px + var(--safe-left));
  font-size: var(--content-font-size);
  line-height: 1.78;
  /* 한글은 단어 중간에서 끊지 않는다. 긴 URL 등만 강제로 접는다. */
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* ---------------- 빈 상태 ---------------- */
.empty {
  position: absolute;
  inset: calc(var(--topbar-h) + var(--safe-top)) 0 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 32px calc(64px + var(--safe-bottom));
  gap: 4px;
}

.empty-icon {
  width: 44px;
  height: 44px;
  fill: none;
  stroke: var(--text-dim);
  stroke-width: 1.3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.55;
  margin-bottom: 12px;
}

.empty h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}

.empty p {
  margin: 6px 0 22px;
  max-width: 19rem;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.6;
  word-break: keep-all;
}

.empty code {
  font-family: var(--mono);
  font-size: 0.92em;
  background: var(--bg-soft);
  padding: 1px 5px;
  border-radius: 4px;
}

.btn-primary {
  border: 1px solid var(--border);
  background: var(--bg-raised);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 12px 28px;
  border-radius: 10px;
  cursor: pointer;
}

.btn-primary:active {
  background: var(--bg-soft);
}

.btn-quiet {
  border: none;
  background: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 14px;
  padding: 12px;
  margin-top: 4px;
  cursor: pointer;
}

/* ---------------- 편집 모드 ---------------- */
.edit-mode {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

.edit-mode .topbar {
  position: static;
  transform: none;
  border-bottom-color: var(--border);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: var(--bg);
}

.edit-mode .topbar-title {
  text-align: center;
  color: var(--text);
}

#editor {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.7;
  padding: 16px calc(18px + var(--safe-right)) calc(24px + var(--safe-bottom))
    calc(18px + var(--safe-left));
}

/* ---------------- 본문(마크다운) ---------------- */
.doc > *:first-child {
  margin-top: 0;
}

.doc h1,
.doc h2,
.doc h3,
.doc h4,
.doc h5,
.doc h6 {
  font-weight: 700;
  line-height: 1.35;
  margin: 1.9em 0 0.65em;
  scroll-margin-top: calc(var(--topbar-h) + var(--safe-top) + 12px);
}

.doc h1 {
  font-size: 1.55em;
  letter-spacing: -0.01em;
}

.doc h2 {
  font-size: 1.3em;
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--border);
}

.doc h3 {
  font-size: 1.12em;
}

.doc h4,
.doc h5,
.doc h6 {
  font-size: 1em;
}

.doc p,
.doc ul,
.doc ol,
.doc blockquote,
.doc pre,
.doc table {
  margin: 0 0 1.1em;
}

.doc a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.doc img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
}

.doc blockquote {
  padding: 0.1em 0 0.1em 1em;
  border-left: 3px solid var(--border);
  color: var(--text-dim);
}

.doc blockquote > *:last-child {
  margin-bottom: 0;
}

.doc code {
  font-family: var(--mono);
  font-size: 0.87em;
  background: var(--bg-soft);
  padding: 0.15em 0.4em;
  border-radius: 5px;
}

.doc pre {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 15px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  line-height: 1.6;
}

.doc pre code {
  background: none;
  padding: 0;
  font-size: 0.85em;
}

.doc table {
  display: block;
  width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
  font-size: 0.93em;
}

.doc th,
.doc td {
  border: 1px solid var(--border);
  padding: 7px 11px;
  text-align: left;
}

.doc th {
  background: var(--bg-soft);
  font-weight: 600;
}

.doc hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2.2em 0;
}

.doc ul,
.doc ol {
  padding-left: 1.4em;
}

.doc li {
  margin: 0.3em 0;
}

.doc li::marker {
  color: var(--text-dim);
}

.doc input[type='checkbox'] {
  margin-right: 0.45em;
  accent-color: var(--text-dim);
}

.doc li:has(> input[type='checkbox']) {
  list-style: none;
  margin-left: -1.25em;
}

/* ---------------- 목차 서랍 ---------------- */
.drawer {
  position: fixed;
  top: 0;
  bottom: 0;
  right: 0;
  z-index: 60;
  width: min(320px, 84vw);
  background: var(--bg-raised);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

.drawer.open {
  transform: translateX(0);
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--topbar-h);
  padding: 0 6px 0 18px;
  border-bottom: 1px solid var(--border);
  flex: none;
}

.drawer-head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
}

.drawer-body {
  overflow-y: auto;
  padding: 8px 0 16px;
}

.toc-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.45;
  padding: 9px 18px;
  cursor: pointer;
}

.toc-item[data-level='1'] {
  font-weight: 600;
}

.toc-item[data-level='3'],
.toc-item[data-level='4'],
.toc-item[data-level='5'],
.toc-item[data-level='6'] {
  color: var(--text-dim);
  font-size: 13.5px;
}

.toc-item:active {
  background: var(--bg-soft);
}

.toc-empty {
  margin: 0;
  padding: 4px 18px;
  font-size: 13.5px;
  color: var(--text-dim);
}

/* ---------------- 메뉴 시트 ---------------- */
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  margin: 0 auto;
  max-width: 460px;
  background: var(--bg-raised);
  border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow);
  padding: 6px 0 calc(10px + var(--safe-bottom));
  transform: translateY(102%);
  transition: transform 0.26s cubic-bezier(0.32, 0.72, 0, 1);
}

.sheet.open {
  transform: translateY(0);
}

.sheet-grip {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 6px auto 10px;
}

.sheet-row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  border: none;
  background: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15.5px;
  padding: 13px 20px;
  cursor: pointer;
  text-align: left;
}

.sheet-row .icon {
  color: var(--icon);
}

.sheet-row:active {
  background: var(--bg-soft);
}

.sheet-row.danger {
  color: var(--danger);
}

.sheet-row.danger .icon {
  color: var(--danger);
}

.sheet-sep {
  height: 1px;
  background: var(--border);
  margin: 6px 20px;
}

.sheet-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 20px;
}

.sheet-label {
  font-size: 15.5px;
}

.stepper {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
}

.stepper button {
  width: 40px;
  height: 34px;
  border: none;
  background: none;
  color: var(--text);
  font-size: 17px;
  font-family: inherit;
  cursor: pointer;
}

.stepper button:active {
  background: var(--bg-soft);
}

.stepper span {
  min-width: 34px;
  text-align: center;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  line-height: 34px;
}

.segmented {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
}

.segmented button {
  border: none;
  background: none;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13.5px;
  padding: 8px 13px;
  cursor: pointer;
}

.segmented button + button {
  border-left: 1px solid var(--border);
}

.segmented button.active {
  background: var(--bg-soft);
  color: var(--text);
  font-weight: 600;
}

/* ---------------- 스크림 / 드롭존 ---------------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}

.scrim.open {
  opacity: 1;
  pointer-events: auto;
}

.dropzone {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--scrim);
  pointer-events: none;
  padding: 32px;
}

.dropzone.active {
  display: flex;
}

.dropzone p {
  margin: 0;
  padding: 30px 36px;
  border: 2px dashed rgba(255, 255, 255, 0.85);
  border-radius: 14px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}

/* ---------------- 넓은 화면 ---------------- */
@media (min-width: 900px) {
  :root {
    --topbar-h: 52px;
  }

  .doc {
    padding-top: 16px;
  }

  .sheet {
    border-radius: 16px;
    bottom: 16px;
    right: 16px;
    left: auto;
    margin: 0;
    width: 360px;
    transform: translateY(calc(100% + 32px));
  }

  .sheet.open {
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.01ms !important;
  }
}

  </style>
</head>
<body>
  <!-- 아이콘 스프라이트: 단색 라인 아이콘, 본문 색상을 그대로 상속한다 -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-list" viewBox="0 0 24 24">
      <line x1="9" y1="6" x2="20" y2="6" /><line x1="9" y1="12" x2="20" y2="12" /><line x1="9" y1="18" x2="20" y2="18" />
      <circle cx="4.5" cy="6" r="1.1" /><circle cx="4.5" cy="12" r="1.1" /><circle cx="4.5" cy="18" r="1.1" />
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" />
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">

  <header class="topbar" id="topbar">
    <h1 class="topbar-title" id="doc-title">마크다운 뷰어</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-toc" type="button" aria-label="목차">
        <svg class="icon"><use href="#i-list" /></svg>
      </button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="메뉴">
        <svg class="icon"><use href="#i-more" /></svg>
      </button>
    </div>
  </header>

  <main class="viewer" id="viewer">
    <article class="doc" id="preview"></article>

    <section class="empty" id="empty">
      <svg class="empty-icon"><use href="#i-doc" /></svg>
      <h2>읽을 문서를 열어주세요</h2>
      <p>기기에 저장된 <code>.md</code> 파일을 그대로 열어볼 수 있습니다.</p>
      <button class="btn-primary" id="btn-open-primary" type="button">파일 열기</button>
      <button class="btn-quiet" id="btn-write" type="button">직접 작성하기</button>
    </section>
  </main>

  <input
    type="file"
    id="file-input"
    accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain"
    hidden
  />

  <!-- 편집: 뷰어와 분리된 별도 모드 -->
  <div class="edit-mode" id="edit-mode" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-edit-back" type="button" aria-label="뷰어로 돌아가기">
        <svg class="icon"><use href="#i-back" /></svg>
      </button>
      <h2 class="topbar-title">편집</h2>
      <div class="topbar-actions">
        <button class="btn-done" id="btn-edit-done" type="button">완료</button>
      </div>
    </header>
    <textarea
      id="editor"
      placeholder="마크다운을 입력하세요..."
      spellcheck="false"
      autocapitalize="off"
      autocomplete="off"
      autocorrect="off"
    ></textarea>
  </div>

  <!-- 목차 -->
  <aside class="drawer" id="toc-drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>목차</h2>
      <button class="icon-btn" id="btn-toc-close" type="button" aria-label="닫기">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
    </div>
    <nav class="drawer-body" id="toc-list"></nav>
  </aside>

  <!-- 메뉴 -->
  <div class="sheet" id="menu-sheet" aria-hidden="true">
    <div class="sheet-grip"></div>

    <button class="sheet-row" id="btn-open" type="button">
      <svg class="icon"><use href="#i-folder" /></svg><span>파일 열기</span>
    </button>
    <button class="sheet-row" id="btn-edit" type="button">
      <svg class="icon"><use href="#i-edit" /></svg><span>편집</span>
    </button>
    <button class="sheet-row" id="btn-save" type="button">
      <svg class="icon"><use href="#i-download" /></svg><span>파일로 저장</span>
    </button>

    <div class="sheet-sep"></div>

    <div class="sheet-field">
      <span class="sheet-label">글자 크기</span>
      <div class="stepper">
        <button id="btn-font-minus" type="button" aria-label="글자 작게">−</button>
        <span id="font-value">17</span>
        <button id="btn-font-plus" type="button" aria-label="글자 크게">+</button>
      </div>
    </div>

    <div class="sheet-field">
      <span class="sheet-label">테마</span>
      <div class="segmented" id="theme-seg">
        <button data-theme="auto" type="button">자동</button>
        <button data-theme="light" type="button">밝게</button>
        <button data-theme="dark" type="button">어둡게</button>
      </div>
    </div>

    <div class="sheet-sep"></div>

    <button class="sheet-row danger" id="btn-clear" type="button">
      <svg class="icon"><use href="#i-trash" /></svg><span>내용 비우기</span>
    </button>
  </div>

  <div class="scrim" id="scrim"></div>

  </script>
  <script>
(() => {
  'use strict';

  // ---------------- 요소 ----------------
  const $ = (id) => document.getElementById(id);

  const topbar = $('topbar');
  const docTitle = $('doc-title');
  const viewer = $('viewer');
  const preview = $('preview');
  const empty = $('empty');
  const editor = $('editor');
  const editMode = $('edit-mode');
  const fileInput = $('file-input');
  const tocDrawer = $('toc-drawer');
  const tocList = $('toc-list');
  const menuSheet = $('menu-sheet');
  const scrim = $('scrim');
  const dropzone = $('dropzone');
  const fontValue = $('font-value');
  const themeSeg = $('theme-seg');

  // ---------------- 저장소 키 ----------------
  const K_DOC = 'md-viewer-draft';
  const K_NAME = 'md-viewer-filename';
  const K_THEME = 'md-viewer-theme';
  const K_FONT = 'md-viewer-font-size';

  const FONT_MIN = 14;
  const FONT_MAX = 26;
  const FONT_DEFAULT = 17;

  const store = {
    get(key) {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return null;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (_) {}
    },
  };

  let content = '';
  let filename = '';
  let fontSize = FONT_DEFAULT;

  // ---------------- 렌더링 ----------------
  if (window.marked) {
    marked.setOptions({ gfm: true, breaks: true });
  }

  function render() {
    const hasContent = content.trim().length > 0;
    empty.hidden = hasContent;
    preview.hidden = !hasContent;

    if (!hasContent) {
      preview.innerHTML = '';
      tocList.innerHTML = '';
      docTitle.textContent = '마크다운 뷰어';
      return;
    }

    let html;
    try {
      html = window.marked ? marked.parse(content) : escapeHtml(content);
    } catch (err) {
      html = `<p>렌더링 오류: ${escapeHtml(String(err))}</p>`;
    }

    preview.innerHTML = window.DOMPurify
      ? DOMPurify.sanitize(html, { ADD_ATTR: ['target'] })
      : html;

    preview.querySelectorAll('a[href]').forEach((a) => {
      if (/^https?:\/\//i.test(a.getAttribute('href') || '')) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    });
    preview.querySelectorAll('img').forEach((img) => img.setAttribute('loading', 'lazy'));

    buildToc();
    updateTitle();
  }

  function escapeHtml(str) {
    const el = document.createElement('div');
    el.textContent = str;
    return el.innerHTML;
  }

  // 상단바에는 파일명을, 없으면 문서의 첫 제목을 보여준다.
  function updateTitle() {
    if (filename) {
      docTitle.textContent = filename;
      return;
    }
    const first = preview.querySelector('h1, h2, h3');
    docTitle.textContent = first ? first.textContent.trim() : '마크다운 뷰어';
  }

  function setContent(text, name) {
    content = text || '';
    if (name !== undefined) {
      filename = name;
      store.set(K_NAME, name);
    }
    editor.value = content;
    store.set(K_DOC, content);
    render();
  }

  // ---------------- 목차 ----------------
  function buildToc() {
    const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
    tocList.innerHTML = '';

    if (!headings.length) {
      tocList.innerHTML = '<p class="toc-empty">제목이 없는 문서입니다.</p>';
      return;
    }

    const used = new Map();
    const frag = document.createDocumentFragment();

    headings.forEach((heading) => {
      const text = (heading.textContent || '').trim();
      const base =
        text
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s-]/gu, '')
          .replace(/\s+/g, '-') || 'section';
      const seen = used.get(base) || 0;
      used.set(base, seen + 1);
      heading.id = seen === 0 ? base : `${base}-${seen}`;

      const level = Number(heading.tagName[1]);
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'toc-item';
      item.dataset.level = String(level);
      item.style.paddingLeft = `${18 + (level - 1) * 13}px`;
      item.textContent = text;
      item.addEventListener('click', () => {
        closeOverlays();
        showTopbar();
        requestAnimationFrame(() => heading.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      });
      frag.appendChild(item);
    });

    tocList.appendChild(frag);
  }

  // ---------------- 오버레이(목차/메뉴) ----------------
  function openToc() {
    closeSheet();
    tocDrawer.classList.add('open');
    tocDrawer.setAttribute('aria-hidden', 'false');
    scrim.classList.add('open');
  }

  function closeToc() {
    tocDrawer.classList.remove('open');
    tocDrawer.setAttribute('aria-hidden', 'true');
  }

  function openSheet() {
    closeToc();
    menuSheet.classList.add('open');
    menuSheet.setAttribute('aria-hidden', 'false');
    scrim.classList.add('open');
  }

  function closeSheet() {
    menuSheet.classList.remove('open');
    menuSheet.setAttribute('aria-hidden', 'true');
  }

  function closeOverlays() {
    closeToc();
    closeSheet();
    scrim.classList.remove('open');
  }

  $('btn-toc').addEventListener('click', openToc);
  $('btn-toc-close').addEventListener('click', closeOverlays);
  $('btn-menu').addEventListener('click', openSheet);
  scrim.addEventListener('click', closeOverlays);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeOverlays();
  });

  // ---------------- 편집 모드 ----------------
  function openEditor() {
    closeOverlays();
    editor.value = content;
    editMode.hidden = false;
    requestAnimationFrame(() => editor.focus());
  }

  function closeEditor() {
    content = editor.value;
    store.set(K_DOC, content);
    // 파일명은 유지하되, 내용이 바뀌었으므로 제목을 다시 계산한다
    render();
    editMode.hidden = true;
    showTopbar();
  }

  $('btn-edit').addEventListener('click', openEditor);
  $('btn-write').addEventListener('click', openEditor);
  $('btn-edit-done').addEventListener('click', closeEditor);
  $('btn-edit-back').addEventListener('click', closeEditor);

  let editSaveTimer = null;
  editor.addEventListener('input', () => {
    clearTimeout(editSaveTimer);
    editSaveTimer = setTimeout(() => store.set(K_DOC, editor.value), 400);
  });

  // ---------------- 파일 열기 / 저장 ----------------
  function pickFile() {
    closeOverlays();
    fileInput.click();
  }

  $('btn-open').addEventListener('click', pickFile);
  $('btn-open-primary').addEventListener('click', pickFile);

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (file) readFile(file);
    fileInput.value = '';
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      setContent(String(reader.result || ''), file.name);
      viewer.scrollTop = 0;
      showTopbar();
    };
    reader.onerror = () => alert('파일을 읽지 못했습니다.');
    reader.readAsText(file);
  }

  $('btn-save').addEventListener('click', () => {
    closeOverlays();
    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename && /\.\w+$/.test(filename) ? filename : 'document.md';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $('btn-clear').addEventListener('click', () => {
    closeOverlays();
    if (content.trim() && !confirm('현재 문서를 비울까요?')) return;
    setContent('', '');
  });

  // 드래그 앤 드롭(데스크톱)
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    dropzone.classList.add('active');
  });
  window.addEventListener('dragover', (e) => {
    if (hasFiles(e)) e.preventDefault();
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropzone.classList.remove('active');
  });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('active');
    if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });

  // ---------------- 글자 크기 ----------------
  function applyFont(size) {
    fontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, size));
    document.documentElement.style.setProperty('--content-font-size', `${fontSize}px`);
    fontValue.textContent = String(fontSize);
    store.set(K_FONT, String(fontSize));
  }

  $('btn-font-minus').addEventListener('click', () => applyFont(fontSize - 1));
  $('btn-font-plus').addEventListener('click', () => applyFont(fontSize + 1));

  // ---------------- 테마 ----------------
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

  function applyTheme(theme) {
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      theme = 'auto';
      document.documentElement.removeAttribute('data-theme');
    }

    themeSeg.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.dataset.theme === theme);
    });

    const dark = theme === 'dark' || (theme === 'auto' && darkQuery.matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#16181d' : '#ffffff');

    store.set(K_THEME, theme);
  }

  themeSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-theme]');
    if (btn) applyTheme(btn.dataset.theme);
  });

  darkQuery.addEventListener('change', () => {
    if ((store.get(K_THEME) || 'auto') === 'auto') applyTheme('auto');
  });

  // ---------------- 상단바 자동 숨김 ----------------
  let lastScroll = 0;
  let ticking = false;

  function showTopbar() {
    topbar.classList.remove('hidden');
  }

  viewer.addEventListener(
    'scroll',
    () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = viewer.scrollTop;
        topbar.classList.toggle('scrolled', y > 4);

        // 아래로 충분히 내려간 뒤에만 숨기고, 위로 올리면 즉시 되돌린다
        if (y > 72 && y > lastScroll + 6) {
          topbar.classList.add('hidden');
        } else if (y < lastScroll - 6 || y <= 72) {
          showTopbar();
        }

        lastScroll = y;
        ticking = false;
      });
    },
    { passive: true }
  );

  // ---------------- 공유로 받기(Web Share Target) ----------------
  async function pickUpSharedContent() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('shared') !== '1') return;

    window.history.replaceState({}, '', window.location.pathname);
    if (!('caches' in window)) return;

    try {
      const cache = await caches.open('md-viewer-share-v1');
      const res = await cache.match('shared-payload');
      if (!res) return;
      const data = await res.json();
      if (data && data.content) {
        setContent(data.content, data.filename || '');
        viewer.scrollTop = 0;
      }
      await cache.delete('shared-payload');
    } catch (err) {
      console.warn('공유된 콘텐츠를 불러오지 못했습니다.', err);
    }
  }

  // ---------------- 초기화 ----------------
  function init() {
    applyTheme(store.get(K_THEME) || 'auto');

    const savedFont = Number(store.get(K_FONT));
    applyFont(Number.isFinite(savedFont) && savedFont ? savedFont : FONT_DEFAULT);

    filename = store.get(K_NAME) || '';
    content = store.get(K_DOC) || '';
    editor.value = content;
    render();

    pickUpSharedContent();

    // 서비스 워커는 http(s)에서만 동작한다.
    // 단일 HTML 파일을 file:// 로 직접 열었을 때는 등록을 시도하지 않는다.
    if (/^https?:$/.test(window.location.protocol) && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('서비스 워커 등록 실패:', err);
        });
      });
    }
  }

  init();
})();

  </script>
</body>
</html>
