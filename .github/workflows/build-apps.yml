name: 앱 빌드

# 수동 실행하거나, v1.0.0 같은 태그를 밀면 빌드해서 릴리스에 올린다.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    name: 데스크탑 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            args: --linux AppImage deb
          - os: windows-latest
            label: Windows
            args: --win nsis portable
          - os: macos-latest
            label: macOS
            args: --mac dmg zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        # 서명 인증서가 없으므로 자동 서명 탐색을 끈다(서명 없이 배포).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
          if-no-files-found: error

  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 의존성 설치
        run: npm ci

      - name: 웹 자산 준비 및 동기화
        run: |
          node build-mobile.js
          npx cap sync android

      - name: APK 빌드 (디버그 서명)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: 릴리스에 첨부
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 릴리스 생성
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
